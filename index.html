
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>차량 판매금액 자동 계산기</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      margin: auto;
      max-width: 720px;
      line-height: 1.6;
    }
    input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      margin: 8px 0 16px 0;
      box-sizing: border-box;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      font-size: 15px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 12px;
      text-align: center;
    }
    th {
      background-color: #f2f2f2;
    }
    h2, h3 {
      color: #2c3e50;
      margin-top: 40px;
    }
    @media screen and (max-width: 600px) {
      table, thead, tbody, th, td, tr {
        display: block;
        width: 100%;
      }
      thead tr {
        display: none;
      }
      tr {
        margin-bottom: 20px;
        border: 1px solid #ccc;
        padding: 10px;
      }
      td {
        text-align: right;
        padding-left: 50%;
        position: relative;
      }
      td::before {
        content: attr(data-label);
        position: absolute;
        left: 10px;
        width: 45%;
        padding-left: 10px;
        font-weight: bold;
        text-align: left;
      }
    }
  </style>
</head>
<body>

  <h2>🚗 차량 판매금액 자동 계산기</h2>

  <label>정상 차량금액 (만원)</label>
  <input type="number" id="normalPrice" placeholder="예: 1800" oninput="calculate()" />

  <label>다운 계약금액 (만원)</label>
  <input type="number" id="downPrice" placeholder="예: 1730" oninput="calculate()" />

  <label>성능비 (만원)</label>
  <input type="number" id="performanceFee" value="56" oninput="calculate()" />

  <h3>📄 다운계약일 때 (계약서 작성용)</h3>
  <table>
    <tbody>
      <tr>
        <td data-label="구분">다운계약</td>
        <td data-label="차량금액" id="d_price">-</td>
        <td data-label="이전비" id="d_tax">-</td>
        <td data-label="매도비">44</td>
        <td data-label="성능비" id="d_perf">-</td>
        <td data-label="총이전비" id="d_sum1">-</td>
        <td data-label="합계" id="d_total">-</td>
      </tr>
    </tbody>
  </table>

  <h3>📑 정상계약일 때 (원래 이전비 기준)</h3>
  <table>
    <tbody>
      <tr>
        <td data-label="구분">정상계약</td>
        <td data-label="차량금액" id="n_price">-</td>
        <td data-label="이전비" id="n_tax">-</td>
        <td data-label="매도비">44</td>
        <td data-label="성능비" id="n_perf">-</td>
        <td data-label="총이전비" id="n_sum1">-</td>
        <td data-label="합계" id="n_total">-</td>
      </tr>
      <tr>
        <td data-label="현금차액" colspan="6"><strong>현금차액</strong></td>
        <td data-label="합계" id="gap"><strong>-</strong></td>
      </tr>
    </tbody>
  </table>

  <script>
    function calculate() {
      const normal = parseFloat(document.getElementById('normalPrice').value);
      const down = parseFloat(document.getElementById('downPrice').value);
      const perf = parseFloat(document.getElementById('performanceFee').value);
      const fee = 44;

      if (!isNaN(normal) && !isNaN(down) && !isNaN(perf)) {
        const normalTax = Math.ceil(normal * 0.085);
        const normalTotal = normal + normalTax + fee + perf;

        const downNet = down / 1.1;
        const downTax = Math.ceil(downNet * 0.07);
        const downTotal = down + downTax + fee + perf;

        const cashGap = Math.ceil(normalTotal - downTotal);

        document.getElementById("n_price").innerText = normal;
        document.getElementById("n_tax").innerText = normalTax;
        document.getElementById("n_perf").innerText = perf;
        document.getElementById("n_sum1").innerText = normalTax + fee + perf;
        document.getElementById("n_total").innerText = normalTotal;

        document.getElementById("d_price").innerText = down;
        document.getElementById("d_tax").innerText = downTax;
        document.getElementById("d_perf").innerText = perf;
        document.getElementById("d_sum1").innerText = downTax + fee + perf;
        document.getElementById("d_total").innerText = downTotal;

        document.getElementById("gap").innerText = cashGap;
      }
    }
  </script>

</body>
</html>
